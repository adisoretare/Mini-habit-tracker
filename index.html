<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Habit Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Habit Tracker</h1>

    <form id="add_habit_form">
        <input type="text" id="add_habit_txt" placeholder="habit name" class="selection" required>
        <input type="color" id="add_habit_color" class="selection">
        <button id="add_habit_button" class="selection">Add Habit</button>
    </form>

    <div id="habits">

    </div>

    <script src="app.js"></script>
</body>
</html>
