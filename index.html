<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Habit Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- ===== Header ===== -->
    <h1>Habit Tracker</h1>

    <!-- ===== Add habit form ===== -->
    <form id="add_habit_form">
        <input type="text" id="add_habit_txt" class="selection" placeholder="habit name" required>
        <input type="color" id="add_habit_color" class="selection">
        <button id="add_habit_button" class="selection">Add Habit</button>
    </form>

    <!-- ===== Habit cards (filled by app.js) ===== -->
    <div id="habits"></div>

    <script src="app.js"></script>
</body>
</html>
